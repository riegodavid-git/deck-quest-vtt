name = "deck-quest-vtt"
main = "src/index.js"
compatibility_date = "2026-06-01"

# One Durable Object class — the authoritative per-room game host.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the FREE Workers plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Edge-hosted art (deck cards) — served from KV via GET /a/<path>.
[[kv_namespaces]]
binding = "ART"
id = "dbce3faa690040009db3f10aef89f306"
